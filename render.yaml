# One-click deploy to Render: New → Blueprint → pick this repo.
#
# Deliberately a STATIC site, not a web service. KAKSHA's browser build calls the
# Claude API directly from the visitor's own browser with the visitor's own key, so
# there is no server to run. That matters on the free tier: a free Render *web
# service* spins down after 15 minutes idle and takes ~1 minute to wake, which a
# judge clicking a demo link would feel. A static site is CDN-distributed with no
# compute and no cold start.
services:
  - name: kaksha
    type: web
    runtime: static
    staticPublishPath: ./docs
    buildCommand: echo "no build step - docs/ is generated by build_docs.py + build_play.py and committed"
    routes:
      - type: rewrite
        source: /play
        destination: /play/index.html
