# Zero-config import: Netlify → Add new site → Import an existing project →
# pick deepakwadge81/kaksha. This file sets the publish directory, so there is
# nothing to fill in by hand.
#
# No build command: docs/ is generated by build_docs.py + build_play.py and
# committed, so Netlify only has to serve it.
[build]
  publish = "docs/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # The live build posts the visitor's own key straight to the Claude API from
    # their browser, so api.anthropic.com must stay reachable; nothing else does.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.anthropic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'"
